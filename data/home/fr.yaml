sections:
  - hero
  - metrics
  - cards
  - type: markdown
    key: mission
  - type: contributors
    key: team
  - cta

hero:
  eyebrow: Business Unit IA de Red Hat
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Illustration abstraite d'un réseau reliant les capacités Red Hat AI
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Nous déployons, utilisons et éprouvons Red Hat AI dans des environnements
    proches de la production. Nous partageons ensuite nos apprentissages,
    bonnes pratiques et patterns avec nos collègues et nos clients.
  # note: Customer zero for Red Hat AI
  actions:
    - { label: Rencontrez l'équipe, url: '#team', icon: fa-solid fa-users, style: primary }

metrics:
  animate: true
  columns: 4
  eyebrow: Quelques chiffres
  items:
    - value: 178
      label: Dépôts dans rh-aiservices-bu
      desc: Partitionnement GPU, opérations LLM, benchmarks et ateliers.
      icon: fa-brands fa-github
      source: { label: Organisation GitHub, url: "https://github.com/rh-aiservices-bu" }
    - value: 96
      label: Démos IA prêtes à déployer
      desc: RAG, IA satellite, agents de chaîne d'approvisionnement et assistants vocaux.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Plugins de tableau de bord
      desc: Extensions communautaires de Red Hat AI.
      icon: fa-solid fa-plug
      source: { label: Plugins communautaires, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Membres de l'équipe
      desc: Adoption clients et innovation pour Red Hat AI.
      icon: fa-solid fa-users
      source: { label: Rencontrez l'équipe, url: '#team' }

cards:
  eyebrow: Ce que nous avons contribué à créer et maintenir
  title: Initiatives
  columns: 2
  items:
    - title: Organisation GitHub Red Hat AI
      desc: Notre organisation principale — 178 dépôts couvrant toutes sortes de projets, prototypes et utilitaires IA.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: Plugins communautaires Red Hat AI Enterprise, qui étendent Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: Des exemples alignés par domaine et orientés résultats montrant comment l'IA résout de vrais problèmes métier.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: Site de documentation avec patterns, démos, outils et guides pour l'IA/ML/Data Science sur OpenShift.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: AI500 — laboratoire MLOps couvrant les instructions de labo, les scripts deploy-lab et l'outillage de déploiement pour automatiser l'entraînement et la livraison des modèles.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: AI501 — atelier GenAIOps de 5 jours couvrant les instructions de labo, les slides et l'outillage de déploiement pour exécuter des charges de travail GenAI en production.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true

mission:
  eyebrow: Ce que nous faisons
  title: Mission
  body: |
    - Utiliser les produits Red Hat AI comme nos clients le feraient/pourraient/devraient
    - Agir comme « client zéro » interne chez Red Hat
    - Aider nos clients sur des sujets IA complexes
    - Partager notre expertise issue de l'expérience de terrain
    - Repousser les limites du possible avec Red Hat AI !

