cta:
  title: Comment nous solliciter.
  text: >-
    Apprenez et obtenez de l'aide sur AI on OpenShift, essayez des démos prêtes
    à déployer dans AI Quickstart, proposez des idées de plugins dans Community
    Plugins — ou ouvrez une issue dans ce dépôt pour travailler directement
    avec l'équipe.
  actions:
    - { label: Apprendre sur AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Essayer les démos AI Quickstart, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Proposer un plugin, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
