cta:
  title: Kom igång
  text: >-
    Lär dig och få hjälp på AI on OpenShift, prova färdiga demos i AI Quickstart,
    kom med plugin-idéer i Community Plugins — eller öppna ett issue i det här
    repot för att arbeta direkt med teamet.
  actions:
    - { label: Lär dig på AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Prova AI Quickstart-demos, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Föreslå ett community-plugin, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
