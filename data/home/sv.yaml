hero:
  eyebrow: CAI-teamet · Red Hats AI-affärsenhet
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Abstrakt nätverksillustration av sammankopplade Red Hat AI-kapabiliteter
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Vi driftsätter, använder och provkör Red Hat AI i produktionsliknande
    miljöer och delar sedan det som fungerar med kunder, partner och kollegor,
    så att de kan utnyttja dess fulla potential.
  actions:
    - { label: Möt teamet, url: '#team', icon: fa-solid fa-users, style: primary }
    - { label: Se vad vi skapar, url: '#cards', icon: fa-solid fa-layer-group, style: ghost }

metrics:
  animate: true
  columns: 4
  eyebrow: Snabba siffror
  items:
    - value: 178
      label: Repositorier i rh-aiservices-bu
      desc: GPU-partitionering, LLM-drift, benchmarks och workshops.
      icon: fa-brands fa-github
      source: { label: GitHub-organisation, url: "https://github.com/rh-aiservices-bu" }
    - value: 70
      suffix: "+"
      label: Demor byggda av teamet
      desc: RAG, satellit-AI, agenter för leveranskedjan och röstassistenter.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Instrumentpanelsplugin
      desc: Quickstarts manager, Kueue visualizer, Apache Superset med flera.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Teammedlemmar
      desc: Utbildning i MLOps och GenAIOps, demor och plugins.
      icon: fa-solid fa-users
      source: { label: Möt teamet, url: '#team' }

cards:
  eyebrow: Det vi skapar och underhåller
  title: Initiativ
  columns: 2
  items:
    - title: GitHub-organisationen Red Hat AI
      desc: För alla — vår huvudorganisation med 178 repos med AI-projekt, prototyper och verktyg.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: För RHAIE-administratörer — community-plugins som utökar Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: För utvecklare — resultatfokuserade exempel på hur AI löser verkliga affärsproblem.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: För alla som vill lära sig AI på OpenShift — mönster, demos, verktyg och guider.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: För teams som bygger MLOps-kompetens — AI500, lab som täcker experiment, automatiserad modellträning och leverans.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: För teams som kör GenAI i produktion — AI501, workshop på 5 dagar med labbinstruktioner, presentationer och driftsättningsverktyg.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true
    - title: LiteMaaS
      desc: För plattformsteams — proof of concept för LLM-prenumerationer, API-nycklar och användningsspårning, integrerat med LiteLLM.
      icon: fa-solid fa-server
      url: https://github.com/rh-aiservices-bu/litemaas
      external: true
    - title: Parasol-workshop
      desc: För den som lär sig genom att göra — deploymentsrecept för Parasol Insurance-demon på ett RHOAI-kluster.
      icon: fa-solid fa-person-chalkboard
      url: https://github.com/rh-aiservices-bu/parasol-demo-deployment
      external: true

tutorials:
  eyebrow: Lär dig
  title: Guider
  body: |
    - [RHOAI MaaS-guide](https://github.com/rh-aiservices-bu/rhoai-maas-guide) — använd modeller som tjänst i Red Hat OpenShift AI
    - [Frånkopplad RHOAI](https://github.com/rh-aiservices-bu/disconnected-rhoai) — kör Red Hat OpenShift AI i frånkopplade (air-gapped) miljöer
    - [Guide för GPU-partitionering](https://github.com/rh-aiservices-bu/gpu-partitioning-guide) — partitionera GPU:er för AI-arbetslaster på OpenShift
    - [Migreringsguide RHOAI 2.25 → 3.5](https://github.com/rh-aiservices-bu/rhoai-2.25-3.5-migration-guide) — migrera Red Hat OpenShift AI från 2.25 till 3.5

mission:
  eyebrow: Vad vi gör
  title: Uppdrag
  body: |
    Med råd grundade i praktisk erfarenhet ger vi kunder, partner och kollegor
    förutsättningar att ta ut den fulla potentialen i Red Hat AI.

    - Använda Red Hat AI-produkter som våra kunder gör
    - Agera som intern ”kund noll” hos Red Hat — pröva våra produkter på oss själva innan kunderna behöver göra det
    - Hjälpa kunder med komplexa AI-ämnen
    - Dela kunskap baserad på erfarenhet ur första hand
    - Pressa gränserna för vad som är möjligt med Red Hat AI!

