sections:
  - hero
  - metrics
  - cards
  - type: markdown
    key: mission
  - type: contributors
    key: team
  - cta

hero:
  eyebrow: Red Hats AI-affärsenhet
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Abstrakt nätverksillustration av sammankopplade Red Hat AI-kapabiliteter
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Vi driftsätter, använder och provkör Red Hat AI i produktionsliknande miljöer.
    Därefter delar vi våra lärdomar, bästa praxis och mönster med kollegor och kunder.
  # note: Customer zero for Red Hat AI
  actions:
    - { label: Möt teamet, url: '#team', icon: fa-solid fa-users, style: primary }

metrics:
  animate: true
  columns: 4
  eyebrow: Snabba siffror
  items:
    - value: 178
      label: Repositorier i rh-aiservices-bu
      desc: GPU-partitionering, LLM-drift, benchmarks och workshops.
      icon: fa-brands fa-github
      source: { label: GitHub-organisation, url: "https://github.com/rh-aiservices-bu" }
    - value: 96
      label: AI-demos redo att driftsättas
      desc: RAG, satellit-AI, agenter för leveranskedjan och röstassistenter.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Instrumentpanelsplugin
      desc: Community-tillägg för Red Hat AI.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Teammedlemmar
      desc: Kundadoption och innovation inom Red Hat AI.
      icon: fa-solid fa-users
      source: { label: Möt teamet, url: '#team' }

cards:
  eyebrow: Det vi har bidragit till att skapa och underhålla
  title: Initiativ
  columns: 2
  items:
    - title: GitHub-organisationen Red Hat AI
      desc: Vår huvudorganisation — 178 repos med alla möjliga AI-projekt, prototyper och verktyg.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: Red Hat AI Enterprise Community-plugins som utökar Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: Vertikalt orienterade, resultatfokuserade exempel på hur AI kan lösa verkliga affärsproblem.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: Dokumentationswebbplats med mönster, demos, verktyg och guider för AI/ML/Data Science på OpenShift.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI501 GenAIOps Enablement
      desc: AI501 — GenAIOps-workshop på 5 dagar som täcker labbinstruktioner, presentationer och driftsättningsverktyg för att köra GenAI-arbetslaster i produktion.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true

mission:
  eyebrow: Vad vi gör
  title: Uppdrag
  body: |
    - Använda Red Hat AI-produkter som våra kunder gör
    - Agera som intern ”kund noll” hos Red Hat
    - Hjälpa kunder med komplexa AI-ämnen
    - Dela kunskap baserad på erfarenhet ur första hand
    - Pressa gränserna för vad som är möjligt med Red Hat AI!

