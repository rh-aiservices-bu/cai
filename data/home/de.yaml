cta:
  title: So starten Sie
  text: >-
    Lernen Sie mit AI on OpenShift und holen Sie sich Hilfe, probieren Sie einsatzbereite
    Demos in AI Quickstart aus, bringen Sie Plugin-Ideen in Community Plugins ein —
    oder legen Sie in diesem Repository ein Issue an, um direkt mit dem Team zu arbeiten.
  actions:
    - { label: Lernen bei AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: AI Quickstart Demos ausprobieren, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Community-Plugin vorschlagen, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
