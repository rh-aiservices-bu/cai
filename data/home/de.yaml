sections:
  - hero
  - metrics
  - cards
  - type: markdown
    key: mission
  - type: contributors
    key: team
  - cta

hero:
  eyebrow: Business Unit KI von Red Hat
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Abstrakte Netzwerkillustration der vernetzten KI-Fähigkeiten von Red Hat
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Wir setzen Red Hat AI in produktionsnahen Umgebungen ein, nutzen und erproben es dort.
    Anschließend teilen wir unsere Erkenntnisse, bewährten Verfahren und Muster mit
    Kolleginnen und Kollegen sowie mit Kunden.
  # note: Customer zero for Red Hat AI
  actions:
    - { label: Team kennenlernen, url: '#team', icon: fa-solid fa-users, style: primary }

metrics:
  animate: true
  columns: 4
  eyebrow: Zahlen auf einen Blick
  items:
    - value: 178
      label: Repositories in rh-aiservices-bu
      desc: GPU-Partitionierung, LLM-Betrieb, Benchmarks und Workshops.
      icon: fa-brands fa-github
      source: { label: GitHub-Organisation, url: "https://github.com/rh-aiservices-bu" }
    - value: 96
      label: Einsatzbereite KI-Demos
      desc: RAG, Satelliten-KI, Supply-Chain-Agenten und Sprachassistenten.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Dashboard-Plugins
      desc: Community-Erweiterungen für Red Hat AI.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Teammitglieder
      desc: Kundennähe und Innovation für Red Hat AI.
      icon: fa-solid fa-users
      source: { label: Team kennenlernen, url: '#team' }

cards:
  eyebrow: Was wir mitgestaltet und gepflegt haben
  title: Initiativen
  columns: 2
  items:
    - title: Red Hat AI GitHub-Organisation
      desc: Unsere zentrale Organisation — 178 Repositories mit allen möglichen KI-Projekten, Prototypen und Hilfsmitteln.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: Community-Plugins für Red Hat AI Enterprise, die Red Hat OpenShift AI erweitern.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: Fachlich ausgerichtete, ergebnisorientierte Beispiele, die zeigen, wie KI reale Geschäftsprobleme lösen kann.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: Dokumentationsseite mit Mustern, Demos, Tools und Anleitungen für KI/ML/Data Science auf OpenShift.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: AI500 — durchgängiges MLOps-Labor mit Laboranleitungen, Deploy-Lab-Skripten und Deployment-Werkzeugen für die Experimentierphase bis hin zu automatisiertem Modelltraining und -auslieferung.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: AI501 — fünftägiger GenAIOps-Workshop mit Laboranleitungen, Folien und Deployment-Werkzeugen für den produktionsnahen Betrieb von GenAI-Workloads.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true

mission:
  eyebrow: Was wir tun
  title: Mission
  body: |
    - Red-Hat-AI-Produkte so nutzen wie unsere Kunden
    - Als internes „Customer Zero“ bei Red Hat agieren
    - Kunden bei komplexen KI-Themen unterstützen
    - Wissen aus erster Hand weitergeben
    - Das Beste aus Red Hat AI herausholen!

