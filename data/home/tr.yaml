cta:
  title: Bize nasıl ulaşabilirsiniz
  text: >-
    AI on OpenShift'te öğrenin ve yardım alın, AI Quickstart'ta dağıtmaya hazır
    demoları deneyin, Community Plugins'te eklenti fikirleri önerin — ya da ekiple
    doğrudan çalışmak için bu depoda bir issue açın.
  actions:
    - { label: AI on OpenShift'te öğrenin, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: AI Quickstart demolarını deneyin, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Eklenti önerin, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
