cta:
  title: Conas tosú
  text: >-
    Foghlaim agus faigh cabhair ag AI on OpenShift, bain triail as taispeántais
    réidh le himscaradh in AI Quickstart, mol smaointe breiseán in Community
    Plugins — nó oscail ceist sa stór seo chun oibriú go díreach leis an
    bhfoireann.
  actions:
    - { label: Foghlaim ag AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Bain triail as taispeántais AI Quickstart, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Mol breiseán pobail, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
