sections:
  - hero
  - metrics
  - cards
  - type: markdown
    key: tutorials
  - type: markdown
    key: mission
  - type: contributors
    key: team
  - cta

hero:
  eyebrow: The CAI team · Red Hat AI Business Unit
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Abstract network illustration of connected Red Hat AI capabilities
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    We deploy, use, and battle-test Red Hat AI in production-like environments —
    then share what works with customers, partners, and colleagues, so they can
    unlock its full potential.
  actions:
    - { label: Meet the team, url: '#team', icon: fa-solid fa-users, style: primary }
    - { label: See what we've built, url: '#cards', icon: fa-solid fa-layer-group, style: ghost }

metrics:
  animate: true
  columns: 4
  eyebrow: Quick numbers
  items:
    - value: 178
      label: Repositories in rh-aiservices-bu
      desc: GPU partitioning, LLM ops, benchmarks, and workshops.
      icon: fa-brands fa-github
      source: { label: GitHub org, url: "https://github.com/rh-aiservices-bu" }
    - value: 70
      suffix: "+"
      label: Demos built by the team
      desc: RAG, satellite AI, supply chain agents, and voice assistants.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Dashboard plugins
      desc: Quickstarts manager, Kueue visualizer, Apache Superset, and more.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Team members
      desc: MLOps and GenAIOps enablement, quickstarts, and plugins.
      icon: fa-solid fa-users
      source: { label: Meet the team, url: '#team' }

cards:
  eyebrow: What we build and maintain
  title: Initiatives
  columns: 2
  items:
    - title: Red Hat AI GitHub org
      desc: For everyone — our main org with 178 repos covering AI projects, prototypes, and utilities.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: For RHAIE admins — community plugins extending Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: For developers — outcome-focused examples of how AI solves real business problems.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: For anyone learning AI on OpenShift — patterns, demos, tools, and how-tos.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: For teams building MLOps skills — AI500 lab covering experimentation, automated model training, and delivery.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: For teams running GenAI in production — AI501, a 5-day workshop with labs, slides, and deployment tooling.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true
    - title: LiteMaaS
      desc: For platform teams — proof-of-concept for LLM subscriptions, API keys, and usage tracking, integrating with LiteLLM.
      icon: fa-solid fa-server
      url: https://github.com/rh-aiservices-bu/litemaas
      external: true
    - title: Parasol workshop
      desc: For hands-on learners — deployment recipe for the Parasol Insurance demo on a RHOAI cluster.
      icon: fa-solid fa-person-chalkboard
      url: https://github.com/rh-aiservices-bu/parasol-demo-deployment
      external: true

tutorials:
  eyebrow: Learn
  title: Tutorials
  body: |
    - [RHOAI MaaS guide](https://github.com/rh-aiservices-bu/rhoai-maas-guide) — use models as a service in Red Hat OpenShift AI
    - [Disconnected RHOAI](https://github.com/rh-aiservices-bu/disconnected-rhoai) — run Red Hat OpenShift AI in disconnected (air-gapped) environments
    - [GPU partitioning guide](https://github.com/rh-aiservices-bu/gpu-partitioning-guide) — partition GPUs for AI workloads on OpenShift
    - [RHOAI 2.25 → 3.5 migration guide](https://github.com/rh-aiservices-bu/rhoai-2.25-3.5-migration-guide) — migrate Red Hat OpenShift AI from 2.25 to 3.5

mission:
  eyebrow: What we do
  title: Mission
  body: |
    Through advice rooted in real-world experience, we empower customers,
    partners and colleagues, to unlock the full potential of Red Hat AI.

    - Leverage Red Hat AI products like our customers do
    - Act as an internal "customer zero" at Red Hat — proving our products on ourselves before customers have to
    - Help support customers on complex AI topics
    - Share expertise based on first-hand experience
    - Push the envelope on what is possible with Red Hat AI!

