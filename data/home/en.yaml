cta:
  title: How to engage.
  text: >-
    Learn and get help at AI on OpenShift, try ready-to-deploy demos in AI Quickstart,
    propose plugin ideas in Community Plugins — or open an issue in this repository
    to work with the team directly.
  actions:
    - { label: Learn at AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Try AI Quickstart demos, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Propose a plugin, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
