sections:
  - hero
  - metrics
  - cards
  - type: markdown
    key: tutorials
  - type: markdown
    key: mission
  - type: contributors
    key: team
  - cta

hero:
  eyebrow: El equipo CAI · Unidad de negocio de IA de Red Hat
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Ilustración abstracta de una red que conecta las capacidades de IA de Red Hat
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Desplegamos, usamos y ponemos a prueba Red Hat AI en entornos similares a
    producción, y luego compartimos lo que funciona con clientes, partners y
    compañeros, para que liberen todo su potencial.
  actions:
    - { label: Conoce al equipo, url: '#team', icon: fa-solid fa-users, style: primary }
    - { label: Mira lo que creamos, url: '#cards', icon: fa-solid fa-layer-group, style: ghost }

metrics:
  animate: true
  columns: 4
  eyebrow: Cifras rápidas
  items:
    - value: 178
      label: Repositorios en rh-aiservices-bu
      desc: Particionado de GPU, operaciones LLM, benchmarks y talleres.
      icon: fa-brands fa-github
      source: { label: Organización de GitHub, url: "https://github.com/rh-aiservices-bu" }
    - value: 70
      suffix: "+"
      label: Demos creadas por el equipo
      desc: RAG, IA satelital, agentes de cadena de suministro y asistentes de voz.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Plugins de panel de control
      desc: Quickstarts manager, Kueue visualizer, Apache Superset y más.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Miembros del equipo
      desc: Habilitación de MLOps y GenAIOps, quickstarts y plugins.
      icon: fa-solid fa-users
      source: { label: Conoce al equipo, url: '#team' }

cards:
  eyebrow: Lo que creamos y mantenemos
  title: Iniciativas
  columns: 2
  items:
    - title: Organización de GitHub de Red Hat AI
      desc: Para todos — nuestra organización principal con 178 repositorios de proyectos, prototipos y utilidades de IA.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: Para admins de RHAIE — plugins comunitarios que amplían Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: Para desarrolladores — ejemplos enfocados en resultados de cómo la IA resuelve problemas de negocio reales.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: Para quien aprenda IA en OpenShift — patrones, demos, herramientas y guías.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: Para equipos que desarrollan habilidades de MLOps — AI500, laboratorio de experimentación, entrenamiento automatizado y entrega de modelos.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: Para equipos que ejecutan GenAI en producción — AI501, taller de 5 días con laboratorios, diapositivas y herramientas de despliegue.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true
    - title: LiteMaaS
      desc: Para equipos de plataforma — prueba de concepto para gestionar suscripciones de LLM, claves API y seguimiento de uso, integrándose con LiteLLM.
      icon: fa-solid fa-server
      url: https://github.com/rh-aiservices-bu/litemaas
      external: true
    - title: Taller Parasol
      desc: Para quienes aprenden practicando — receta de despliegue de la demo Parasol Insurance en un clúster de RHOAI.
      icon: fa-solid fa-person-chalkboard
      url: https://github.com/rh-aiservices-bu/parasol-demo-deployment
      external: true

tutorials:
  eyebrow: Aprender
  title: Tutoriales
  body: |
    - [Guía de MaaS de RHOAI](https://github.com/rh-aiservices-bu/rhoai-maas-guide) — usar modelos como servicio en Red Hat OpenShift AI
    - [RHOAI desconectado](https://github.com/rh-aiservices-bu/disconnected-rhoai) — ejecutar Red Hat OpenShift AI en entornos desconectados (air-gapped)
    - [Guía de particionado de GPU](https://github.com/rh-aiservices-bu/gpu-partitioning-guide) — particionar GPU para cargas de trabajo de IA en OpenShift
    - [Guía de migración de RHOAI 2.25 → 3.5](https://github.com/rh-aiservices-bu/rhoai-2.25-3.5-migration-guide) — migrar Red Hat OpenShift AI de 2.25 a 3.5

mission:
  eyebrow: Lo que hacemos
  title: Misión
  body: |
    Con consejos basados en la experiencia del mundo real, capacitamos a
    clientes, partners y compañeros para liberar todo el potencial de Red Hat AI.

    - Usar los productos de Red Hat AI como lo hacen nuestros clientes
    - Actuar como "cliente cero" interno en Red Hat — probar nuestros productos en nosotros mismos antes de que los clientes tengan que hacerlo
    - Ayudar a dar soporte a los clientes en temas complejos de IA
    - Compartir experiencia basada en la vivencia de primera mano
    - ¡Llevar al límite lo que es posible con Red Hat AI!

