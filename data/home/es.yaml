cta:
  title: Cómo empezar
  text: >-
    Aprende y obtén ayuda en AI on OpenShift, prueba demos listas para desplegar
    en AI Quickstart, propone ideas de plugins en Community Plugins — o abre un
    issue en este repositorio para trabajar directamente con el equipo.
  actions:
    - { label: Aprender en AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Probar las demos de AI Quickstart, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Proponer un plugin de la comunidad, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
