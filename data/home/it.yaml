hero:
  eyebrow: Il team CAI · Business Unit IA di Red Hat
  image:
    light: landing/hero-light.svg
    dark: landing/hero-dark.svg
    alt: Illustrazione astratta di una rete che collega le capacità Red Hat AI
  media:
    hide_below: lg
  title_size: 2.8rem
  title_lines:
    - words: [{ text: "Customer Adoption" }]
    - words: [{ text: "and Innovation" }]
    - words: [{ mark: "(CAI)", color: red }]
  lead: >-
    Installiamo, usiamo e mettiamo alla prova Red Hat AI in ambienti simili alla
    produzione, poi condividiamo ciò che funziona con clienti, partner e
    colleghi, per aiutarli a sbloccarne il pieno potenziale.
  actions:
    - { label: Incontra il team, url: '#team', icon: fa-solid fa-users, style: primary }
    - { label: Scopri cosa creiamo, url: '#cards', icon: fa-solid fa-layer-group, style: ghost }

metrics:
  animate: true
  columns: 4
  eyebrow: Qualche numero
  items:
    - value: 178
      label: Repository in rh-aiservices-bu
      desc: Partizionamento GPU, operazioni LLM, benchmark e workshop.
      icon: fa-brands fa-github
      source: { label: Organizzazione GitHub, url: "https://github.com/rh-aiservices-bu" }
    - value: 70
      suffix: "+"
      label: Demo create dal team
      desc: RAG, IA satellitare, agenti per la supply chain e assistenti vocali.
      icon: fa-solid fa-rocket
      source: { label: AI Quickstart, url: "https://github.com/rh-ai-quickstart" }
    - value: 6
      label: Plugin per dashboard
      desc: Quickstarts manager, Kueue visualizer, Apache Superset e altri.
      icon: fa-solid fa-plug
      source: { label: Community Plugins, url: "https://github.com/rh-ai-community-plugins" }
    - value: 9
      label: Membri del team
      desc: Abilitazione MLOps e GenAIOps, quickstart e plugin.
      icon: fa-solid fa-users
      source: { label: Incontra il team, url: '#team' }

cards:
  eyebrow: Cosa creiamo e manteniamo
  title: Iniziative
  columns: 2
  items:
    - title: Organizzazione GitHub Red Hat AI
      desc: Per tutti — la nostra organizzazione principale con 178 repository di progetti, prototipi e utilità IA.
      icon: fa-solid fa-layer-group
      url: https://github.com/rh-aiservices-bu
      external: true
    - title: Red Hat AI Community Plugins
      desc: Per gli admin RHAIE — plugin della community che estendono Red Hat OpenShift AI.
      icon: fa-solid fa-plug
      url: https://github.com/rh-ai-community-plugins
      external: true
    - title: AI Quickstarts
      desc: Per gli sviluppatori — esempi orientati al risultato che mostrano come l'IA risolve problemi aziendali reali.
      icon: fa-solid fa-rocket
      url: https://github.com/rh-ai-quickstart
      external: true
    - title: AI on OpenShift
      desc: Per chi impara l'IA su OpenShift — pattern, demo, strumenti e guide.
      icon: fa-solid fa-book-open
      url: https://ai-on-openshift.io/
      external: true
    - title: AI500 MLOps Enablement
      desc: Per i team che sviluppano competenze MLOps — AI500, lab su sperimentazione, addestramento automatizzato e consegna dei modelli.
      icon: fa-solid fa-infinity
      url: https://github.com/rhoai-mlops
      external: true
    - title: AI501 GenAIOps Enablement
      desc: Per i team che eseguono GenAI in produzione — AI501, workshop di 5 giorni con lab, slide e strumenti di distribuzione.
      icon: fa-solid fa-graduation-cap
      url: https://github.com/rhoai-genaiops
      external: true
    - title: LiteMaaS
      desc: Per i team di piattaforma — proof of concept per gestire abbonamenti LLM, chiavi API e tracciamento dell'uso, integrato con LiteLLM.
      icon: fa-solid fa-server
      url: https://github.com/rh-aiservices-bu/litemaas
      external: true
    - title: Workshop Parasol
      desc: Per chi impara facendo — ricetta di distribuzione della demo Parasol Insurance su un cluster RHOAI.
      icon: fa-solid fa-person-chalkboard
      url: https://github.com/rh-aiservices-bu/parasol-demo-deployment
      external: true

tutorials:
  eyebrow: Impara
  title: Guide
  body: |
    - [Guida MaaS di RHOAI](https://github.com/rh-aiservices-bu/rhoai-maas-guide) — usare i modelli come servizio in Red Hat OpenShift AI
    - [RHOAI disconnesso](https://github.com/rh-aiservices-bu/disconnected-rhoai) — eseguire Red Hat OpenShift AI in ambienti disconnessi (air-gapped)
    - [Guida al partizionamento GPU](https://github.com/rh-aiservices-bu/gpu-partitioning-guide) — partizionare le GPU per carichi di lavoro IA su OpenShift
    - [Guida alla migrazione RHOAI 2.25 → 3.5](https://github.com/rh-aiservices-bu/rhoai-2.25-3.5-migration-guide) — migrare Red Hat OpenShift AI da 2.25 a 3.5

mission:
  eyebrow: Cosa facciamo
  title: Missione
  body: |
    Con consigli radicati nell'esperienza sul campo, diamo a clienti, partner e
    colleghi gli strumenti per sbloccare il pieno potenziale di Red Hat AI.

    - Usare i prodotti Red Hat AI come farebbero i nostri clienti
    - Fare da "customer zero" interno in Red Hat — provare i nostri prodotti su noi stessi prima che debbano farlo i clienti
    - Aiutare i clienti su temi IA complessi
    - Condividere competenze basate sull'esperienza diretta
    - Andare oltre i limiti del possibile con Red Hat AI!

