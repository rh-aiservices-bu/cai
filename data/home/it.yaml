cta:
  title: Come contattarci
  text: >-
    Impara e ottieni supporto su AI on OpenShift, prova le demo pronte da
    distribuire in AI Quickstart, proponi idee di plugin in Community
    Plugins — oppure apri una issue in questo repository
    per lavorare direttamente con il team.
  actions:
    - { label: Impara su AI on OpenShift, url: "https://ai-on-openshift.io/", icon: fa-solid fa-book-open, style: primary, external: true }
    - { label: Prova le demo di AI Quickstart, url: "https://github.com/rh-ai-quickstart", icon: fa-solid fa-rocket, style: ghost, external: true }
    - { label: Proponi un plugin, url: "https://github.com/rh-ai-community-plugins", icon: fa-solid fa-plug, style: ghost, external: true }
