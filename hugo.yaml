# CAI team page — Hugo + OINK (github.com/pgsty/oink), pinned in go.mod.
title: AI Customer Adoption and Innovation (CAI)
baseURL: https://rh-aiservices-bu.github.io/cai/
defaultContentLanguage: en
disableLanguages: [zh]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: AI Customer Adoption and Innovation (CAI)
    params:
      description: The Customer Adoption & Innovation team of Red Hat's AI Business Unit — initiatives, demos, plugins, and how to engage.
    # Keep disabled languages declared so Hugo recognizes .zh.md peers.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 3
    title: AI Customer Adoption and Innovation (CAI)
    hasCJKLanguage: true
  fr:
    label: Français
    locale: fr-FR
    weight: 2
    title: Customer Adoption and Innovation (CAI)
    params:
      description: L'équipe Adoption clients et innovation IA de l'unité Business IA de Red Hat — initiatives, démos, plugins et comment nous solliciter.

  es:
    label: Español
    locale: es-ES
    weight: 4
    title: Customer Adoption and Innovation (CAI)
    params:
      description: El equipo de Adopción de clientes e innovación de IA de la unidad de negocio de IA de Red Hat — iniciativas, demos, plugins y cómo colaborar.
  de:
    label: Deutsch
    locale: de-DE
    weight: 5
    title: Customer Adoption and Innovation (CAI)
    params:
      description: Das Team Customer Adoption & Innovation der Business Unit KI von Red Hat — Initiativen, Demos, Plugins und wie Sie mit uns ins Gespräch kommen.
  sv:
    label: Svenska
    locale: sv-SE
    weight: 6
    title: Customer Adoption and Innovation (CAI)
    params:
      description: Teamet Customer Adoption & Innovation inom Red Hats AI-affärsenhet — initiativ, demos, plugins och hur du samarbetar med oss.
  it:
    label: Italiano
    locale: it-IT
    weight: 7
    title: Customer Adoption and Innovation (CAI)
    params:
      description: Il team Customer Adoption & Innovation dell'unità di business IA di Red Hat — iniziative, demo, plugin e come contattarci.

  tr:
    label: Türkçe
    locale: tr-TR
    weight: 8
    title: Customer Adoption and Innovation (CAI)
    params:
      description: Red Hat'ın AI İş Birimi'ndeki Müşteri Benimseme ve İnovasyon ekibi — girişimler, demolar, eklentiler ve bize nasıl ulaşabileceğiniz.

# OINK's Markdown components depend on these Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  footer_center_info: ''
  ui:
    dark_mode: true
    page_context_menu:
      assistant_links: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups

  github_repo: https://github.com/rh-aiservices-bu/cai
  github_branch: main

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
