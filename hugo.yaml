# CAI team page — Hugo + OINK (github.com/pgsty/oink), pinned in go.mod.
title: Customer Adoption and Innovation (CAI)
baseURL: https://rh-aiservices-bu.github.io/cai/
defaultContentLanguage: en
disableLanguages: [zh]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Customer Adoption and Innovation (CAI)
    # Keep disabled languages declared so Hugo recognizes .zh.md peers.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 3
    title: Customer Adoption and Innovation (CAI)
    hasCJKLanguage: true
  fr:
    label: Français
    locale: fr-FR
    weight: 2
    title: Customer Adoption and Innovation (CAI)

  es:
    label: Español
    locale: es-ES
    weight: 4
    title: Customer Adoption and Innovation (CAI)
  de:
    label: Deutsch
    locale: de-DE
    weight: 5
    title: Customer Adoption and Innovation (CAI)
  sv:
    label: Svenska
    locale: sv-SE
    weight: 6
    title: Customer Adoption and Innovation (CAI)
  it:
    label: Italiano
    locale: it-IT
    weight: 7
    title: Customer Adoption and Innovation (CAI)

  tr:
    label: Türkçe
    locale: tr-TR
    weight: 8
    title: Customer Adoption and Innovation (CAI)

# OINK's Markdown components depend on these Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS, LLMSFULL]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  footer_center_info: ''
  ui:
    dark_mode: true
    page_context_menu:
      assistant_links: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups

  github_repo: https://github.com/rh-aiservices-bu/cai
  github_branch: main

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
